<!DOCTYPE html>
<html>
<head>
    <style>
        #ul {   
            text-decoration-line: underline;
            text-decoration-style: solid;
            text-decoration-color: red;
            text-decoration-thickness: 5px;


        }

        #on {   
            text-decoration-line: overline;
            text-decoration-style: wavy;
            text-decoration-color: red;
            text-decoration-thickness: 3px;

    
        }

        #lt {    
            color: white;
            text-align: center;
            font-size: 40px;
            text-decoration-line: line-through;
            text-shadow: 4px 5px 2px black, 4px 5px 2px blue, 5px 6px 2px red;
        }
    </style>
</head>

<body>
    <h2 id="ul">Underline content</h2>
    <h2 id="on">Overline content</h2>
    <h2 id="lt">Line-through content</h2>
</body>
</html>
